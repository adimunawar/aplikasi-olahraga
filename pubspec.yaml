name: workout_app
description: "Aplikasi Olahraga Rumah - Program 30 Hari (Hipertrofi & Kekuatan)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  wakelock_plus: 1.2.8
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  supabase_flutter: ^2.8.4
  go_router: ^18.1.3
  slang: ^4.19.2
  slang_flutter: ^4.19.0

dependency_overrides:
  shared_preferences_android: 2.3.4
  package_info_plus: 8.3.1
  path_provider_android: 2.2.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/images/exercises/
    - assets/muscle/front/
    - assets/muscle/back/
    - assets/muscle/previews/
