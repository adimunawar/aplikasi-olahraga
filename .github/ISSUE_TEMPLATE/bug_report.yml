name: Bug report
description: Report a reproducible defect in Workout Coach
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Check whether the issue already exists. Do not include credentials, personal user data, signed URLs, or private logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
      placeholder: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence.
      placeholder: |
        1. Open...
        2. Tap...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: Android device / OS version
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: App version / commit SHA
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized logs
      description: Remove tokens, user identifiers, body measurements, signed URLs, and other private data.
    validations:
      required: false
