name: Flutter CI

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
  # Develop is validated on PR; staging pushes build and deploy Web.
  # Main pushes skip Analyze and Test because PR validation already ran.
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # 1. ANALYZE
  # Run during PR validation and manual workflows.
  # Staging and main pushes reuse successful PR validation.
  # --------------------------------------------------
  analyze:
    name: Analyze Dart & Flutter
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || (github.ref != 'refs/heads/staging' && github.ref != 'refs/heads/main')
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze project
        run: flutter analyze --no-pub --no-fatal-infos

  # --------------------------------------------------
  # 2. TEST
  # Run during PR validation and manual workflows.
  # Staging and main pushes reuse successful PR validation.
  # --------------------------------------------------
  test:
    name: Run Flutter tests
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || (github.ref != 'refs/heads/staging' && github.ref != 'refs/heads/main')
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run tests with coverage
        run: flutter test --no-pub --coverage

      - name: Upload test coverage report
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v7
        with:
          name: flutter-test-coverage-${{ github.sha }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  # Development builds are manual and only available for the develop ref.
  # This produces a signed Release-mode APK artifact but does not distribute it.
  build_develop:
    name: Build Develop APK (manual)
    runs-on: ubuntu-latest

    needs:
      - analyze
      - test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Prepare Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${ANDROID_KEYSTORE_BASE64:?Missing GitHub secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing GitHub secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing GitHub secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing GitHub secret ANDROID_KEY_PASSWORD}"

          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare Firebase configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          : "${GOOGLE_SERVICES_JSON:?Missing GitHub secret GOOGLE_SERVICES_JSON}"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Build Develop APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --no-pub

      - name: Upload Develop APK
        uses: actions/upload-artifact@v7
        with:
          name: home-bulking-coach-develop-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------
  # 3. WEB BUILD
  # Ensures SQLite Web assets are generated and Flutter Web builds cleanly.
  # Build Web only on staging pushes, after PR validation has passed.
  # Analyze and Test are skipped on staging pushes to avoid duplicate work.
  # --------------------------------------------------
  build_web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    needs:
      - analyze
      - test
    # Build and deploy Web only after changes are merged into staging.
    # PR validation is handled by Analyze and Test above.
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/staging'
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate SQLite Web assets
        run: dart run sqflite_common_ffi_web:setup

      - name: Build Flutter Web (WASM)
        run: flutter build web --wasm --release --no-pub

      # Deploy only after a successful push to staging.
      # Pull requests targeting staging still run the build but never deploy.
      - name: Prepare Vercel static output
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .vercel/output/static
          cp -R build/web/. .vercel/output/static/

          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF

      - name: Install Vercel CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        run: npm install --global vercel@latest

      - name: Deploy Flutter Web to Vercel Preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --yes
