name: Publish Mobile Release

on:
  push:
    branches:
      - main
    paths:
      - pubspec.yaml

permissions:
  contents: write

concurrency:
  group: publish-mobile-release
  cancel-in-progress: false

jobs:
  publish:
    name: Tag and publish mobile release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION_LINE="$(grep -E '^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$' pubspec.yaml || true)"
          if [[ -z "$VERSION_LINE" ]]; then
            echo "::error::pubspec.yaml must contain version: x.y.z+build"
            exit 1
          fi

          VERSION="$(sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/' <<< "$VERSION_LINE")"
          BUILD="$(sed -E 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)$/\1/' <<< "$VERSION_LINE")"
          TAG="v$VERSION"

          LATEST_TAG="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n1)"
          if [[ -n "$LATEST_TAG" ]]; then
            LATEST_VERSION="${LATEST_TAG#v}"
            SORTED_TOP="$(printf '%s\n%s\n' "$LATEST_VERSION" "$VERSION" | sort -V | tail -n1)"
            if [[ "$VERSION" == "$LATEST_VERSION" || "$SORTED_TOP" != "$VERSION" ]]; then
              echo "::error::Version $VERSION must be greater than the latest release $LATEST_VERSION."
              exit 1
            fi
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

          {
            echo "## Mobile release published"
            echo
            echo "- Version: $VERSION"
            echo "- Build number: $BUILD"
            echo "- Tag: $TAG"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
