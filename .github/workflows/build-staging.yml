name: Build & Distribute Staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: staging-build-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_staging:
    name: Build Staging APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Prepare Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: \${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: \${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: \${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: \${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "\${ANDROID_KEYSTORE_BASE64:?Missing GitHub secret ANDROID_KEYSTORE_BASE64}"
          : "\${ANDROID_KEYSTORE_PASSWORD:?Missing GitHub secret ANDROID_KEYSTORE_PASSWORD}"
          : "\${ANDROID_KEY_ALIAS:?Missing GitHub secret ANDROID_KEY_ALIAS}"
          : "\${ANDROID_KEY_PASSWORD:?Missing GitHub secret ANDROID_KEY_PASSWORD}"

          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare Firebase configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: \${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          : "\${GOOGLE_SERVICES_JSON:?Missing GitHub secret GOOGLE_SERVICES_JSON}"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Build Staging APK
        env:
          ANDROID_KEYSTORE_PASSWORD: \${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: \${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: \${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --no-pub

      - name: Upload Staging APK
        uses: actions/upload-artifact@v7
        with:
          name: home-bulking-coach-staging-\${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  distribute_firebase:
    name: Distribute Staging to Firebase
    runs-on: ubuntu-latest
    needs:
      - build_staging
    timeout-minutes: 20

    steps:
      - name: Validate Firebase distribution configuration
        shell: bash
        env:
          FIREBASE_APP_ID: \${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: \${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TESTER_GROUPS: \${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          set -euo pipefail
          : "\${FIREBASE_APP_ID:?Missing GitHub secret FIREBASE_APP_ID}"
          : "\${FIREBASE_SERVICE_ACCOUNT_JSON:?Missing GitHub secret FIREBASE_SERVICE_ACCOUNT_JSON}"
          : "\${FIREBASE_TESTER_GROUPS:?Missing GitHub Actions variable FIREBASE_TESTER_GROUPS}"

      - name: Download Staging APK
        uses: actions/download-artifact@v7
        with:
          name: home-bulking-coach-staging-\${{ github.sha }}
          path: build/app/outputs/flutter-apk

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Distribute Staging to Firebase App Distribution
        shell: bash
        env:
          FIREBASE_APP_ID: \${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: \${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TESTER_GROUPS: \${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          set -euo pipefail

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK_PATH"

          SERVICE_ACCOUNT_PATH="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$SERVICE_ACCOUNT_PATH"
          trap 'rm -f "$SERVICE_ACCOUNT_PATH"' EXIT

          export GOOGLE_APPLICATION_CREDENTIALS="$SERVICE_ACCOUNT_PATH"
          npm install --global firebase-tools

          RELEASE_NOTES="Staging release \${GITHUB_SHA::7}"
          firebase appdistribution:distribute "$APK_PATH" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "$RELEASE_NOTES"
