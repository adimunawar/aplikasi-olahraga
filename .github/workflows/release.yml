name: Prepare Mobile Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: prepare-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Update release version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/')
    timeout-minutes: 10

    steps:
      - name: Checkout selected release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Calculate and update version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          VERSION_LINE="$(grep -E '^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$' pubspec.yaml || true)"
          if [[ -z "$VERSION_LINE" ]]; then
            echo "::error::pubspec.yaml must contain version: x.y.z+build"
            exit 1
          fi

          CURRENT_VERSION="$(sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$/\1/' <<< "$VERSION_LINE")"
          CURRENT_BUILD="$(sed -E 's/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+)$/\1/' <<< "$VERSION_LINE")"

          git fetch origin main --tags
          LATEST_TAG="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n1)"
          BASE_VERSION="$CURRENT_VERSION"
          if [[ -n "$LATEST_TAG" ]]; then
            LATEST_VERSION="${LATEST_TAG#v}"
            if [[ ! "$LATEST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Latest release tag '$LATEST_TAG' is not stable SemVer."
              exit 1
            fi
            BASE_VERSION="$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | tail -n1)"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          case "$BUMP" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            *)
              echo "::error::Unsupported bump: $BUMP"
              exit 1
              ;;
          esac

          NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
          NEXT_BUILD=$((CURRENT_BUILD + 1))
          NEXT_VERSION_LINE="version: $NEXT_VERSION+$NEXT_BUILD"

          if git tag --list "v$NEXT_VERSION" | grep -q .; then
            echo "::error::Tag v$NEXT_VERSION already exists."
            exit 1
          fi

          sed -i -E "s/^version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$/$NEXT_VERSION_LINE/" pubspec.yaml

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$NEXT_BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version update to release branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(release): prepare v$VERSION+$BUILD"
          git push origin "HEAD:$BRANCH"

      - name: Write summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          {
            echo "## Release version prepared"
            echo
            echo "- Version: $VERSION"
            echo "- Build number: $BUILD"
            echo "- Tag to be created after merge: $TAG"
            echo "- Updated branch: $BRANCH"
            echo
            echo "Next step: open/update the pull request from this release branch to main."
          } >> "$GITHUB_STEP_SUMMARY"
