name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Calculate version and create GitHub Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::The release workflow must run against the latest main commit."
            exit 1
          fi

          if [[ ! -f pubspec.yaml ]]; then
            echo "::error::pubspec.yaml was not found."
            exit 1
          fi

      - name: Calculate next semantic version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+[[:space:]]*$/\1/p' pubspec.yaml | head -n1)"
          if [[ -z "$CURRENT_VERSION" ]]; then
            echo "::error::Could not parse version from pubspec.yaml."
            exit 1
          fi

          LATEST_TAG="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n1)"
          if [[ -n "$LATEST_TAG" ]]; then
            BASE_VERSION="${LATEST_TAG#v}"
          else
            BASE_VERSION="$CURRENT_VERSION"
          fi

          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest release tag '$LATEST_TAG' is not a stable SemVer tag."
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          case "$BUMP" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            *)
              echo "::error::Unsupported version increment: $BUMP"
              exit 1
              ;;
          esac

          NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
          NEXT_TAG="v$NEXT_VERSION"

          if git rev-parse -q --verify "refs/tags/$NEXT_TAG" >/dev/null; then
            echo "::error::Tag $NEXT_TAG already exists."
            exit 1
          fi

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes

          {
            echo "## Release created"
            echo
            echo "- Tag: $RELEASE_TAG"
            echo "- Version: $RELEASE_VERSION"
            echo "- Increment: $RELEASE_BUMP"
            echo "- Source commit: $GITHUB_SHA"
            echo
            echo "The tag points to the protected main commit. No commit was pushed to main."
          } >> "$GITHUB_STEP_SUMMARY"
