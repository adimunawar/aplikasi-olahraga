name: Deploy Flutter Web to Vercel (Production)

on:
  push:
    branches:
      - main
    paths:
      # Flutter application source and build inputs.
      - "lib/**"
      - "assets/**"
      - "fonts/**"
      - "shaders/**"
      - "web/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "l10n.yaml"
      - "slang.yaml"
      # Keep deployment behavior changes verifiable through the same pipeline.
      - ".github/workflows/deploy-production-vercel.yml"
      - "vercel.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy production web
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 40

    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate SQLite Web assets
        run: dart run sqflite_common_ffi_web:setup

      - name: Build Flutter Web (WASM)
        run: flutter build web --wasm --release --no-pub

      - name: Prepare Vercel static output
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .vercel/output/static
          cp -R build/web/. .vercel/output/static/

          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Flutter Web to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --yes
