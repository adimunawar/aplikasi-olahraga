org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Keep the legacy AGP DSL and Kotlin Gradle Plugin compatibility path until
# the app and all resolved Android plugins are verified with the AGP 9 defaults.
android.newDsl=false
android.builtInKotlin=false
# Matikan incremental compilation Kotlin untuk mencegah error beda drive C: (pub cache) & D: (project) di Windows
kotlin.incremental=false
kotlin.incremental.java=false

